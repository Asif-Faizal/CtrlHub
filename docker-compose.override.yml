# Local development only (applied automatically by `docker compose up`).
# Exposes internal services on localhost. For production run:
#   docker compose -f docker-compose.yml up -d
services:
  mysql:
    ports:
      - "127.0.0.1:3306:3306"
  backend:
    environment:
      APP_ENV: development
    ports:
      - "127.0.0.1:8080:8080"
  n8n:
    ports:
      - "127.0.0.1:5678:5678"
  waha:
    ports:
      - "127.0.0.1:3000:3000"
